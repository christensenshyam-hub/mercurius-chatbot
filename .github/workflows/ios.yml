name: iOS

# Runs the native-app test suite on every push to main and every PR
# targeting main. Three jobs in parallel:
#
#   * spm       — `swift test` on the macOS host. Covers every SPM
#                 package test target (the test/suite count is whatever
#                 `swift test` prints — it is not pinned here) plus
#                 ArchitectureTests which validate the package
#                 dependency graph against the pinned manifest.json
#                 fixture.
#
#   * xcode     — `xcodebuild test` on an iOS Simulator. Runs
#                 MercuriusTests (smoke test + view snapshots) and
#                 MercuriusUITests (end-to-end accessibility-API
#                 driven flows). Snapshot tests are SKIPPED in CI —
#                 reference images were captured on a specific local
#                 simulator/OS combo, and pixel diffs against a
#                 runner-simulator would flake without adding value
#                 until we pin the sim explicitly in a follow-up.
#
#   * mac       — the native Mac app (MercuriusMac): Debug and Release
#                 builds (unsigned; the Release one universal), checks of
#                 the built bundles, and a launch smoke test through the
#                 DEBUG -MacSnapshot harness. Its unit tests — the shell,
#                 the composer keys, the snapshot harness's arguments, the
#                 release settings — are `#if os(macOS)` package tests that
#                 the spm job above already runs on the same Xcode.
#
# What this workflow intentionally does NOT do yet:
#   * Run the live-network-dependent tests (none of the committed
#     tests require network — the Club fixture is pinned and every
#     other HTTP path uses StubURLProtocol — but leaving this note
#     here in case future changes reintroduce a live dep).
#   * Publish coverage to Codecov or similar. `scripts/coverage.sh`
#     regenerates the baseline locally; wiring it into CI is a
#     Phase 4b follow-up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow manual runs from the Actions UI.
  workflow_dispatch:

# Cancel in-flight runs on the same ref when a new one comes in —
# avoids burning minutes on obsolete commits after a quick push-push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Runner image and Xcode, the same for all three jobs.
#
# GitHub retired the macos-14 images on 2026-11-02
# (actions/runner-images#15226); every job on them is cancelled at start
# ("The configuration 'macos-14-arm64-us-default' is not supported"). Their
# `latest-stable` Xcode was 16.2 (Swift 6.0.3), the toolchain the
# "CI, Xcode 16.2" notes in the Swift sources and scripts/ci-compat-lint.py
# describe.
#
# `macos-15` (Arm64) ships Xcode 16.0–16.4 and 26.0–26.3, so
# `latest-stable` there would quietly move CI to Xcode 26. Its iOS
# simulator runtimes are 18.5, 18.6 and 26.x, which leaves nothing for
# Xcode 16.2's iOS 18.2 SDK. Xcode 16.4 (Swift 6.1, the iOS 18.5 / macOS
# 15.5 SDKs) is the image default and the newest Xcode 16: the closest to
# the old 16.2 that has a simulator runtime of its own. It is pinned
# exactly, so an image update can't change it. Moving CI to Xcode 26 means
# moving to the `macos-26` image as well (it has no Xcode 16).
env:
  CI_XCODE: '16.4'

jobs:
  spm:
    name: SPM tests
    # macOS runner — `swift test` is fine on Linux for pure-Swift
    # packages, but NetworkingKit uses the URLSession data-delegate
    # path and DesignSystem uses UIColor shims, so we stay on macOS.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Pin Xcode 16+ — swift-testing (`import Testing`, `@Test`,
        # `#expect`) is a required dep of our test suite and didn't
        # ship in Xcode 15. Update this pin when bumping
        # swift-tools-version in Package.swift. The version is CI_XCODE
        # above, shared by all three jobs.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.CI_XCODE }}

      - name: Print toolchain
        run: swift --version && xcodebuild -version

      - name: Swift package tests (incl. ArchitectureTests)
        working-directory: ios/Packages
        run: swift test --parallel

  xcode:
    name: Xcode scheme tests
    runs-on: macos-15
    # Above the test step's own 80-minute cap, so a slow or hung test step
    # FAILS (and its xcresult is uploaded) instead of the whole job being
    # cancelled with no diagnostics.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.CI_XCODE }}

      - name: Install toolchain (xcodegen, xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Generate Mercurius.xcodeproj
        working-directory: ios
        run: xcodegen generate

      - name: List available iOS simulators
        # Diagnostic output for when the destination filter below
        # breaks on an image update. Keeps the cause visible in logs.
        run: |
          xcodebuild -version
          echo "iOS Simulator SDK: $(xcrun --sdk iphonesimulator --show-sdk-version)"
          xcrun simctl list runtimes available
          xcrun simctl list devices available | head -60

      - name: Boot the test simulator
        id: sim
        # The App Store screenshot test used to be the cold-simulator
        # warm-up (it ran first and retried its first launch). It no longer
        # runs in CI, so boot the test device before the test step starts.
        # Best effort: the test step boots it anyway if this does not.
        # The device: an iPhone 16 on the runtime that matches the selected
        # Xcode's iOS Simulator SDK (18.5 under Xcode 16.4). Not "the newest
        # runtime": macos-15 also carries iOS 26 runtimes, which Xcode 16
        # can't test on. Its udid goes to the test step, so the device
        # booted here is the one tested.
        # Capped so setup + boot + the 80-minute test step stay inside the
        # job's 90 minutes and the xcresult upload still runs.
        continue-on-error: true
        timeout-minutes: 5
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          rt="iOS-$(echo "$sdk" | tr . -)"
          udid=$(xcrun simctl list devices available -j | jq -r --arg rt "$rt" '
            [.devices | to_entries[] | select(.key | endswith("." + $rt))
             | .value[] | select(.name == "iPhone 16") | .udid] | first // empty')
          if [ -z "$udid" ]; then echo "no iPhone 16 simulator on $rt; skipping"; exit 0; fi
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "booting $udid (iPhone 16, $rt)"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Run Xcode tests
        working-directory: ios
        # 80 minutes: the lesson interactives' UI tests add several minutes
        # to a pass, and a failed test's retries (below) run it again; 50
        # ran out mid-retry.
        timeout-minutes: 80
        # Destination:
        #   * The simulator the boot step above booted, by udid: an
        #     iPhone 16 on the runtime matching the selected Xcode's iOS
        #     Simulator SDK (iOS 18.5 under Xcode 16.4 on macos-15).
        #   * If that step found none, `OS=latest,name=iPhone 16`: `latest`
        #     is the selected Xcode's SDK version, and the iPhone 16 family
        #     is stocked under every iOS 18 and 26 runtime on GitHub's
        #     images (iPhone 15 sims only under iOS 17 runtimes, which
        #     macos-15 doesn't carry).
        # Skips:
        #   * `MercuriusTests/ViewSnapshotTests` — pixel references were
        #     recorded on a specific local sim and will not match a
        #     GitHub runner sim 1:1 without pinning.
        #   * `MercuriusUITests/AppStoreScreenshots` — the App Store
        #     screenshot generator (48-370 s per pass, retries included);
        #     ios/scripts/screenshots.sh runs it on its own.
        # Retries:
        #   * The runner's simulator intermittently fails to terminate the
        #     app between XCUITests ("Failed to terminate
        #     com.mayoailiteracy.mercurius.native") — a different test
        #     each run, unrelated to the code under test. Retry failed
        #     tests up to 3 iterations with a fresh test-runner launch
        #     between them; a test that passes on retry counts as passed,
        #     a real failure still fails three times.
        # Pipe:
        #   * `set -o pipefail` so a failing xcodebuild fails the step
        #     even after flowing through xcbeautify.
        env:
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -o pipefail
          dest='platform=iOS Simulator,OS=latest,name=iPhone 16'
          if [ -n "$SIM_UDID" ]; then dest="platform=iOS Simulator,id=$SIM_UDID"; fi
          echo "destination: $dest"
          xcodebuild test \
            -project Mercurius.xcodeproj \
            -scheme Mercurius \
            -destination "$dest" \
            -skip-testing:MercuriusTests/ViewSnapshotTests \
            -skip-testing:MercuriusUITests/PerformanceTests \
            -skip-testing:MercuriusUITests/AppStoreScreenshots \
            -retry-tests-on-failure \
            -test-iterations 3 \
            -test-repetition-relaunch-enabled YES \
            -resultBundlePath build/TestResults.xcresult \
            | xcbeautify

      - name: Upload xcresult bundle on failure
        # A step timeout counts as a failure (the job cap above leaves room
        # for this upload); a superseded run's cancel uploads nothing.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: ios/build/TestResults.xcresult
          retention-days: 7

  mac:
    name: Mac app
    # The same runner image and Xcode as the jobs above (CI_XCODE: Xcode
    # 16.4 / Swift 6.1 / the macOS 15.5 SDK). The Mac app's
    # own target (ios/MercuriusMac) is only compiled here: `swift test`
    # covers the packages, not the app shell or the screenshot harness.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.CI_XCODE }}

      - name: Print toolchain
        run: swift --version && xcodebuild -version && xcrun --sdk macosx --show-sdk-version

      - name: Install toolchain (xcodegen, xcbeautify)
        run: brew install xcodegen xcbeautify

      - name: Generate Mercurius.xcodeproj
        working-directory: ios
        run: xcodegen generate

      # Unsigned: the runner has no signing identity, and none is needed to
      # compile, check the bundle and launch it. (Release signing needs the
      # team's Apple Distribution certificate and the "Mercurius Mac App
      # Store" profile; scripts/release.sh --platform mac does that.)
      - name: Build MercuriusMac (Debug)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mercurius.xcodeproj \
            -scheme MercuriusMac \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath build/mac-dd \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      # Release compiles without the DEBUG-only code (the screenshot harness,
      # the launch flags) and for both arm64 and x86_64, as the Mac App Store
      # build will.
      - name: Build MercuriusMac (Release, universal)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project Mercurius.xcodeproj \
            -scheme MercuriusMac \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/mac-dd \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Check the built bundles
        working-directory: ios
        run: |
          scripts/mac-bundle-check.sh build/mac-dd/Build/Products/Debug/Mercurius.app debug
          scripts/mac-bundle-check.sh build/mac-dd/Build/Products/Release/Mercurius.app release

      # Launch the Debug app on the runner's desktop and let the harness
      # photograph two states and quit: the first-run gate (before any
      # network call) and Today past it. It proves the app starts unsigned,
      # makes its window, reaches the gate and quits by itself. Isolated as
      # every harness run is: in-memory chats and session id, the local
      # server URL — nothing reaches production. 700×600 (the window's
      # minimum) fits the runner's small screen. The script fails a picture
      # that is blank (one colour) or the wrong size — so this proves the
      # window was drawn, not only that it opened. ACTIVATE=NO: a headless
      # runner has no session that can make the window key, so an inactive
      # window is expected here (the key-window check is for local runs).
      - name: Launch smoke test
        working-directory: ios
        run: |
          MAC_APP="$PWD/build/mac-dd/Build/Products/Debug/Mercurius.app" VARIANTS=min ACTIVATE=NO \
            scripts/mac-snapshots.sh "$RUNNER_TEMP/mac-smoke" gate-meet today

      - name: Upload the smoke-test pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-smoke
          path: ${{ runner.temp }}/mac-smoke
          retention-days: 7
          if-no-files-found: ignore
