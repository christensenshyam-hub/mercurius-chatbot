<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="Writing from Mayo AI Literacy Club members." />

  <meta property="og:type" content="article" />
  <meta property="og:title" content="Post — Mayo AI Literacy Club" />
  <meta property="og:description" content="Writing from Mayo AI Literacy Club members." />
  <meta property="og:image" content="https://mayoailiteracy.com/logo.png" />
  <meta name="twitter:card" content="summary" />

  <link rel="icon" href="/logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css?v=2" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" role="banner">
    <div class="container header-inner">
      <a class="brand" href="/" aria-label="Mayo AI Literacy Club home">
        <img class="brand-logo" src="/logo.png" alt="" width="34" height="34" />
        <span class="brand-name">Mayo <span class="brand-name-accent">AI Literacy</span> Club</span>
      </a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Primary">
        <a href="/about">About</a>
        <a href="/topics">Topics</a>
        <a href="/events">Events</a>
        <a href="/blog">Blog</a>
        <a href="/mercurius">Mercurius Ⅰ</a>
        <a class="cta-pill" href="/join">Join Us</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="section" aria-label="Blog post">
      <div class="container post-container">
        <a class="back-link" href="/blog">← Back to Blog</a>
        <article id="post-content">
          <noscript><p class="blog-empty">This post needs JavaScript to load.</p></noscript>
        </article>
      </div>
    </section>
  </main>

  <footer class="site-footer" role="contentinfo">
    <div class="container footer-inner">
      <div>
        <a class="brand" href="/" aria-label="Mayo AI Literacy Club home">
          <span class="brand-name">Mayo <span class="brand-name-accent">AI Literacy</span> Club</span>
        </a>
        <p class="footer-tagline">Understanding AI, together.</p>
      </div>
      <nav class="footer-nav" aria-label="Footer">
        <a href="/about">About</a>
        <a href="/topics">Topics</a>
        <a href="/events">Events</a>
        <a href="/blog">Blog</a>
        <a href="/mercurius">Mercurius Ⅰ</a>
        <a href="https://www.instagram.com/mayoailiteracy" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
      <p class="footer-copy">© <span id="year">2026</span> Mayo AI Literacy Club</p>
    </div>
  </footer>

  <script src="/script.js?v=1" defer></script>
  <script defer>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('id');
      const article = document.getElementById('post-content');

      // Minimal text formatter for post content: paragraphs split on blank
      // lines, "## " headings, **bold**, *italic*. Text nodes only — post
      // content is data, never injected as raw HTML.
      function renderBody(raw, into) {
        String(raw).trim().split(/\n\n+/).forEach((block) => {
          block = block.trim();
          if (!block) return;
          let el;
          if (block.startsWith('## ')) {
            el = document.createElement('h2');
            el.textContent = block.slice(3);
          } else {
            el = document.createElement('p');
            // Split on **bold** / *italic* markers, build nodes.
            block.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g).forEach((part) => {
              if (/^\*\*[^*]+\*\*$/.test(part)) {
                const b = document.createElement('strong');
                b.textContent = part.slice(2, -2);
                el.appendChild(b);
              } else if (/^\*[^*]+\*$/.test(part)) {
                const i = document.createElement('em');
                i.textContent = part.slice(1, -1);
                el.appendChild(i);
              } else if (part) {
                el.appendChild(document.createTextNode(part));
              }
            });
          }
          into.appendChild(el);
        });
      }

      window.mayoFetch('/blog-content.json').then((posts) => {
        const post = (posts || []).find((p) => p.id === postId);
        if (!post) {
          article.innerHTML = '<h1>Post not found</h1><p><a class="back-link" href="/blog">← Back to Blog</a></p>';
          return;
        }
        document.title = `${post.title} — Mayo AI Literacy Club`;

        const header = document.createElement('div');
        header.className = 'post-header';
        header.innerHTML = `
          <div class="blog-meta">
            <span class="blog-category"></span>
            <span class="blog-date"></span>
            <span class="blog-author"></span>
          </div>
          <h1></h1>
          <p class="post-summary"></p>`;
        header.querySelector('.blog-category').textContent = post.category;
        header.querySelector('.blog-date').textContent = post.date;
        header.querySelector('.blog-author').textContent = post.author ? `by ${post.author}` : '';
        header.querySelector('h1').textContent = post.title;
        header.querySelector('.post-summary').textContent = post.summary || '';
        article.appendChild(header);

        const body = document.createElement('div');
        body.className = 'post-body';
        renderBody(post.content, body);
        article.appendChild(body);

        const footer = document.createElement('div');
        footer.className = 'post-footer';
        footer.innerHTML = '<a class="btn btn-ghost" href="/blog">← All Posts</a>';
        article.appendChild(footer);
      }).catch(() => {
        article.innerHTML = '<h1>Couldn’t load this post</h1><p><a class="back-link" href="/blog">← Back to Blog</a></p>';
      });
    });
  </script>
</body>
</html>
