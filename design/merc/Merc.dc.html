<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
@keyframes merc-bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-7px) rotate(1deg)}}
@keyframes merc-bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes merc-jump{0%,100%{transform:translateY(0)}40%,60%{transform:translateY(-18px)}}
@keyframes merc-lean{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-8deg) translateY(-2px)}}
@keyframes merc-snooze{0%,100%{transform:translateY(3px) rotate(2.5deg)}50%{transform:translateY(6px) rotate(3.5deg)}}
@keyframes merc-shadow{0%,100%{transform:translateX(-50%) scaleX(1);opacity:.22}50%{transform:translateX(-50%) scaleX(.86);opacity:.14}}
@keyframes merc-wingL{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(-17deg)}}
@keyframes merc-wingR{0%,100%{transform:rotate(3deg)}50%{transform:rotate(17deg)}}
@keyframes merc-blink{0%,91%,100%{transform:scaleY(1)}95%,97%{transform:scaleY(.1)}}
@keyframes merc-look{0%,30%{transform:translateX(0)}48%,70%{transform:translateX(2.5px)}86%,100%{transform:translateX(-2px)}}
@keyframes merc-twinkle{0%,100%{transform:rotate(0) scale(.55);opacity:.3}50%{transform:rotate(45deg) scale(1.05);opacity:1}}
@keyframes merc-wave{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-22deg)}}
@keyframes merc-cheer{0%,100%{transform:rotate(-32deg)}50%{transform:rotate(-98deg)}}
@keyframes merc-dot{0%,100%{opacity:.2;transform:translateY(2px) scale(.8)}50%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes merc-zzz{0%{opacity:0;transform:translate(0,0) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(9px,-24px) scale(1.15)}}
@keyframes merc-pop{0%{opacity:0;transform:scale(0) translateY(2px)}30%{opacity:1;transform:scale(1.1) translateY(-6px)}100%{opacity:0;transform:scale(.6) translateY(-18px)}}
</style>
</helmet>
<div style="position:relative;width:160px;height:180px;">

  <div style="position:absolute;left:50%;bottom:3px;width:74px;height:13px;background:radial-gradient(ellipse,rgba(50,20,110,.5),transparent 70%);border-radius:50%;animation:merc-shadow 3.4s ease-in-out infinite;"></div>

  <div style="position:absolute;left:0;top:0;width:160px;height:180px;animation:{{ bobAnim }};transform-origin:center bottom;">

    <!-- FEET -->
    <div style="position:absolute;left:61px;top:167px;width:19px;height:10px;border-radius:50% 50% 45% 45%;background:linear-gradient(160deg,#6a39e6,#8d2fd6);"></div>
    <div style="position:absolute;left:81px;top:167px;width:19px;height:10px;border-radius:50% 50% 45% 45%;background:linear-gradient(160deg,#6a39e6,#8d2fd6);"></div>
    <!-- LEGS -->
    <div style="position:absolute;left:67px;top:148px;width:11px;height:24px;border-radius:6px;background:linear-gradient(160deg,#5f33d6,#8132cf);"></div>
    <div style="position:absolute;left:83px;top:148px;width:11px;height:24px;border-radius:6px;background:linear-gradient(160deg,#5f33d6,#8132cf);"></div>

    <!-- NECK -->
    <div style="position:absolute;left:73px;top:80px;width:14px;height:18px;border-radius:6px;background:linear-gradient(160deg,#5f33d6,#8a35d4);"></div>

    <!-- LEFT ARM -->
    <div style="position:absolute;left:45px;top:97px;width:13px;height:42px;border-radius:8px;background:linear-gradient(160deg,#4a5ff2,#7C3AED);transform:rotate(7deg);box-shadow:0 3px 8px -3px rgba(80,40,200,.4);"></div>

    <!-- ROBE BASE -->
    <div style="position:absolute;left:52px;top:94px;width:56px;height:62px;border-radius:40% 40% 33% 33%/38% 38% 62% 62%;background:linear-gradient(165deg,#ffffff,#ece8ff);box-shadow:0 10px 22px -8px rgba(60,40,140,.32), inset -4px -6px 12px rgba(120,90,200,.12);"></div>
    <!-- SHOULDER DRAPE -->
    <div style="position:absolute;left:48px;top:95px;width:66px;height:21px;border-radius:11px;background:linear-gradient(160deg,#f7f5ff,#e2ddf7);transform:rotate(24deg);box-shadow:0 4px 8px -4px rgba(60,40,140,.28);"></div>
    <!-- FOLD LINES -->
    <div style="position:absolute;left:58px;top:120px;width:44px;height:2px;border-radius:2px;background:rgba(74,46,128,.13);transform:rotate(19deg);"></div>
    <div style="position:absolute;left:60px;top:130px;width:36px;height:2px;border-radius:2px;background:rgba(74,46,128,.1);transform:rotate(17deg);"></div>
    <!-- BARE SHOULDER -->
    <div style="position:absolute;left:52px;top:90px;width:22px;height:18px;border-radius:50%;background:linear-gradient(155deg,#4a5ff2,#7C3AED);"></div>
    <!-- GOLD BELT -->
    <div style="position:absolute;left:57px;top:128px;width:46px;height:4px;border-radius:3px;background:linear-gradient(90deg,#e9c768,#caa23a);transform:rotate(-2deg);box-shadow:0 1px 2px rgba(120,80,10,.3);"></div>
    <div style="position:absolute;left:76px;top:126px;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d784,#c89e35);box-shadow:0 1px 2px rgba(120,80,10,.32);"></div>

    <!-- RIGHT ARM (state-driven) -->
    <div style="position:absolute;left:103px;top:86px;width:13px;height:44px;border-radius:8px;background:linear-gradient(160deg,#4a5ff2,#7C3AED);transform-origin:center top;animation:{{ armAnim }};box-shadow:0 3px 8px -3px rgba(100,50,200,.4);"></div>

    <!-- LEFT WING -->
    <div style="position:absolute;left:22px;top:0px;width:44px;height:52px;transform-origin:bottom right;animation:merc-wingL 1.6s ease-in-out infinite;">
      <div style="position:absolute;right:0;bottom:0;width:38px;height:12px;border-radius:50% 50% 50% 5px;background:linear-gradient(120deg,#2f56f5,#86a6ff);transform:rotate(-26deg);box-shadow:0 1px 4px rgba(40,30,140,.3);"></div>
      <div style="position:absolute;right:6px;bottom:10px;width:33px;height:11px;border-radius:50% 50% 50% 5px;background:linear-gradient(120deg,#3d61ff,#9ab6ff);transform:rotate(-44deg);"></div>
      <div style="position:absolute;right:12px;bottom:21px;width:26px;height:10px;border-radius:50% 50% 50% 5px;background:linear-gradient(120deg,#5274ff,#bcc7ff);transform:rotate(-62deg);"></div>
      <div style="position:absolute;right:18px;bottom:30px;width:20px;height:9px;border-radius:50% 50% 50% 5px;background:linear-gradient(120deg,#6f8eff,#d2dbff);transform:rotate(-78deg);"></div>
    </div>
    <!-- RIGHT WING -->
    <div style="position:absolute;right:22px;top:0px;width:44px;height:52px;transform-origin:bottom left;animation:merc-wingR 1.6s ease-in-out infinite;">
      <div style="position:absolute;left:0;bottom:0;width:38px;height:12px;border-radius:50% 50% 5px 50%;background:linear-gradient(240deg,#2f56f5,#86a6ff);transform:rotate(26deg);box-shadow:0 1px 4px rgba(40,30,140,.3);"></div>
      <div style="position:absolute;left:6px;bottom:10px;width:33px;height:11px;border-radius:50% 50% 5px 50%;background:linear-gradient(240deg,#3d61ff,#9ab6ff);transform:rotate(44deg);"></div>
      <div style="position:absolute;left:12px;bottom:21px;width:26px;height:10px;border-radius:50% 50% 5px 50%;background:linear-gradient(240deg,#5274ff,#bcc7ff);transform:rotate(62deg);"></div>
      <div style="position:absolute;left:18px;bottom:30px;width:20px;height:9px;border-radius:50% 50% 5px 50%;background:linear-gradient(240deg,#6f8eff,#d2dbff);transform:rotate(78deg);"></div>
    </div>

    <!-- HEAD -->
    <div style="position:absolute;left:52px;top:26px;width:56px;height:62px;border-radius:48% 48% 44% 44%/50% 50% 52% 52%;background:linear-gradient(155deg,#3D5AFF 0%,#7C3AED 56%,#B53BE8 100%);box-shadow:inset -5px -6px 13px rgba(40,8,90,.26), 0 8px 16px -6px rgba(90,45,210,.5);"></div>
    <!-- HELMET DOME -->
    <div style="position:absolute;left:55px;top:17px;width:50px;height:34px;border-radius:52% 52% 38% 38%;background:linear-gradient(150deg,#5a23c9,#8d2fd6);box-shadow:inset 0 -3px 7px rgba(30,8,70,.3);"></div>
    <!-- BRIM -->
    <div style="position:absolute;left:46px;top:45px;width:68px;height:10px;border-radius:6px;background:linear-gradient(#ffffff,#e7e3ff);transform:rotate(-4deg);box-shadow:0 2px 5px rgba(40,10,80,.24);"></div>

    <!-- EYEBROWS (stoic: thin, flat) -->
    <div style="position:absolute;left:61px;top:53px;width:11px;height:3px;border-radius:2px;background:#2a1f63;"></div>
    <div style="position:absolute;left:88px;top:53px;width:11px;height:3px;border-radius:2px;background:#2a1f63;"></div>

    <!-- EYES: OPEN (stoic: solid ovals) -->
    <sc-if value="{{ eyesOpen }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:64px;top:56px;width:7px;height:11px;border-radius:5px;background:#241b5e;animation:merc-blink 5.2s ease-in-out infinite;transform-origin:center;"><div style="position:absolute;top:1.5px;right:1px;width:2.6px;height:2.6px;background:#fff;border-radius:50%;"></div></div>
      <div style="position:absolute;left:89px;top:56px;width:7px;height:11px;border-radius:5px;background:#241b5e;animation:merc-blink 5.2s ease-in-out infinite;transform-origin:center;"><div style="position:absolute;top:1.5px;right:1px;width:2.6px;height:2.6px;background:#fff;border-radius:50%;"></div></div>
    </sc-if>
    <!-- EYES: HAPPY -->
    <sc-if value="{{ eyesHappy }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:59px;top:60px;width:15px;height:8px;border:2.5px solid #241b5e;border-bottom:none;border-radius:10px 10px 0 0;"></div>
      <div style="position:absolute;left:86px;top:60px;width:15px;height:8px;border:2.5px solid #241b5e;border-bottom:none;border-radius:10px 10px 0 0;"></div>
    </sc-if>
    <!-- EYES: CLOSED -->
    <sc-if value="{{ eyesClosed }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:60px;top:62px;width:14px;height:7px;border:2.3px solid #241b5e;border-top:none;border-radius:0 0 9px 9px;"></div>
      <div style="position:absolute;left:86px;top:62px;width:14px;height:7px;border:2.3px solid #241b5e;border-top:none;border-radius:0 0 9px 9px;"></div>
    </sc-if>

    <!-- MOUTH variants -->
    <sc-if value="{{ mouthSmile }}" hint-placeholder-val="{{ true }}">
      <div style="position:absolute;left:50%;top:76px;transform:translateX(-50%);width:9px;height:3px;border-radius:2px;background:#241b5e;"></div>
    </sc-if>
    <sc-if value="{{ mouthGrin }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:50%;top:73px;transform:translateX(-50%);width:19px;height:11px;background:#241b5e;border-radius:4px 4px 11px 11px;overflow:hidden;"><div style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:10px;height:5px;background:#ff7eb0;border-radius:6px 6px 3px 3px;"></div></div>
    </sc-if>
    <sc-if value="{{ mouthO }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:50%;top:74px;transform:translateX(-50%);width:8px;height:9px;border:2.2px solid #241b5e;border-radius:50%;"></div>
    </sc-if>
    <sc-if value="{{ mouthSleep }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:50%;top:76px;transform:translateX(-50%);width:6px;height:7px;border:2px solid #241b5e;border-radius:50%;"></div>
    </sc-if>

    <!-- SPARKLE -->
    <div style="position:absolute;left:114px;top:12px;width:18px;height:18px;background:linear-gradient(135deg,#8fb3ff,#cf8bff);clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%);animation:merc-twinkle 2.6s ease-in-out infinite;transform-origin:center;"></div>

    <!-- THINKING DOTS -->
    <sc-if value="{{ showThink }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:64px;top:4px;width:7px;height:7px;border-radius:50%;background:#7C3AED;animation:merc-dot 1.2s ease-in-out infinite;"></div>
      <div style="position:absolute;left:76px;top:4px;width:7px;height:7px;border-radius:50%;background:#7C3AED;animation:merc-dot 1.2s ease-in-out infinite .2s;"></div>
      <div style="position:absolute;left:88px;top:4px;width:7px;height:7px;border-radius:50%;background:#7C3AED;animation:merc-dot 1.2s ease-in-out infinite .4s;"></div>
    </sc-if>
    <!-- SLEEP ZZZ -->
    <sc-if value="{{ showZzz }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:106px;top:26px;font-family:'Nunito',sans-serif;font-weight:900;font-style:italic;font-size:12px;color:#9a7bff;animation:merc-zzz 2.4s ease-in infinite;">z</div>
      <div style="position:absolute;left:112px;top:18px;font-family:'Nunito',sans-serif;font-weight:900;font-style:italic;font-size:15px;color:#8a6bff;animation:merc-zzz 2.4s ease-in infinite .8s;">z</div>
      <div style="position:absolute;left:119px;top:8px;font-family:'Nunito',sans-serif;font-weight:900;font-style:italic;font-size:18px;color:#7C3AED;animation:merc-zzz 2.4s ease-in infinite 1.6s;">z</div>
    </sc-if>
    <!-- CELEBRATE CONFETTI -->
    <sc-if value="{{ showCelebrate }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:36px;top:34px;width:8px;height:8px;border-radius:2px;background:#3D5AFF;animation:merc-pop 1s ease-out infinite;"></div>
      <div style="position:absolute;left:116px;top:40px;width:8px;height:8px;border-radius:2px;background:#B53BE8;animation:merc-pop 1s ease-out infinite .15s;"></div>
      <div style="position:absolute;left:48px;top:12px;width:7px;height:7px;border-radius:50%;background:#e9c768;animation:merc-pop 1s ease-out infinite .3s;"></div>
      <div style="position:absolute;left:104px;top:10px;width:7px;height:7px;border-radius:50%;background:#7C3AED;animation:merc-pop 1s ease-out infinite .45s;"></div>
      <div style="position:absolute;left:26px;top:58px;width:8px;height:8px;border-radius:2px;background:#ff7eb0;animation:merc-pop 1s ease-out infinite .6s;"></div>
      <div style="position:absolute;left:128px;top:62px;width:8px;height:8px;border-radius:50%;background:#3D5AFF;animation:merc-pop 1s ease-out infinite .75s;"></div>
      <div style="position:absolute;left:78px;top:0px;width:9px;height:9px;background:linear-gradient(135deg,#8fb3ff,#cf8bff);clip-path:polygon(50% 0,59% 41%,100% 50%,59% 59%,50% 100%,41% 59%,0 50%,41% 41%);animation:merc-pop 1s ease-out infinite .35s;"></div>
    </sc-if>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:260,&quot;height&quot;:280},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;idle&quot;,&quot;wave&quot;,&quot;happy&quot;,&quot;thinking&quot;,&quot;celebrate&quot;,&quot;sleep&quot;],&quot;default&quot;:&quot;idle&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state || 'idle';
    const M = {
      idle:      {bob:'merc-bob 3.4s ease-in-out infinite',    arm:'none',                                eyes:'open',   mouth:'smile'},
      wave:      {bob:'merc-bob 1.8s ease-in-out infinite',    arm:'merc-wave 0.7s ease-in-out infinite', eyes:'open',   mouth:'smile'},
      happy:     {bob:'merc-bounce 0.9s ease-in-out infinite', arm:'merc-wave 1.1s ease-in-out infinite', eyes:'happy',  mouth:'grin'},
      thinking:  {bob:'merc-lean 3.4s ease-in-out infinite',   arm:'none',                                eyes:'open',   mouth:'o',    think:true},
      celebrate: {bob:'merc-jump 0.7s ease-in-out infinite',   arm:'merc-cheer 0.5s ease-in-out infinite',eyes:'happy',  mouth:'grin', celebrate:true},
      sleep:     {bob:'merc-snooze 4.2s ease-in-out infinite', arm:'none',                                eyes:'closed', mouth:'sleep',zzz:true},
    };
    const c = M[s] || M.idle;
    return {
      bobAnim: c.bob,
      armAnim: c.arm,
      eyesOpen: c.eyes === 'open',
      eyesHappy: c.eyes === 'happy',
      eyesClosed: c.eyes === 'closed',
      mouthSmile: c.mouth === 'smile',
      mouthGrin: c.mouth === 'grin',
      mouthO: c.mouth === 'o',
      mouthSleep: c.mouth === 'sleep',
      showThink: !!c.think,
      showZzz: !!c.zzz,
      showCelebrate: !!c.celebrate,
    };
  }
}
</script>
</body>
</html>
